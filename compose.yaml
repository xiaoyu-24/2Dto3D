name: drawing-platform
x-backend: &backend
  build: ./backend
  environment: &backend-env
    DB_HOST: mysql
    DB_NAME: drawings
    DB_USER: drawings
    DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    COOKIE_SECURE: ${COOKIE_SECURE:-0}
  init: true
services:
  mysql:
    image: mysql:8.4
    command: ["--max-allowed-packet=256M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: drawings
      MYSQL_USER: drawings
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["sh", "-ec", "alembic upgrade head && python -m app.bootstrap"]
    environment:
      <<: *backend-env
      BOOTSTRAP_LOGIN: ${BOOTSTRAP_LOGIN:?Set BOOTSTRAP_LOGIN in .env}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD in .env}
    depends_on:
      mysql: { condition: service_healthy }
  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
      M1_HARNESS_URL: http://vision:8011
      M1_VISION_PROJECT_ID: ${M1_VISION_PROJECT_ID:-1}
      M1_VISION_BUDGET_CNY: ${M1_VISION_BUDGET_CNY:-}
    networks: [default, vision]
    depends_on:
      migrate: { condition: service_completed_successfully }
      vision: { condition: service_started }
    restart: unless-stopped
  vision:
    build: ./m0/harness
    platform: linux/amd64
    command: ["python", "m1_service.py"]
    networks: [vision]
    read_only: true
    init: true
    environment:
      HOME: /run/dsh-native
      TMPDIR: /run/dsh-native
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/anthropic}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /run/dsh-native:exec,uid=65534,gid=65534,mode=0700,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  mysql-data:
networks:
  vision:
